<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and home indicator so the
         tab bar can sit on the safe-area inset rather than above a white band. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0E2338" />

    <!-- Added to Home Screen on iOS: run without Safari chrome, dark status bar over
         the navy header, and a real app icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workbench" />
    <link rel="apple-touch-icon" href="/app-icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icons/icon-192.png" />
    <meta
      name="description"
      content="Team workspace for IP Corporation data and delivery."
    />
    <title>IP Corporation Workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
